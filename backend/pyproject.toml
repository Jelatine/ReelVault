[project]
name = "reelvault"
version = "0.2.6"
description = "Self-hosted video library: streaming, editing and file management"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "aiofiles>=24.1",
    "python-multipart>=0.0.9",
    "pypinyin==0.55.0",
    "cryptography>=50.0.2",
    "qrcode>=8.2",
]

[project.scripts]
reelvault = "reelvault.__main__:main"

[project.optional-dependencies]
link-import = [
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-aiofiles",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reelvault"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reelvault/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["reelvault/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
