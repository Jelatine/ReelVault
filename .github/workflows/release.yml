name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    concurrency:
      group: reelvault-ghcr-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional CLIP/face model service. Includes the faces extra; face models stay
  # unloaded unless started with --faces, and no model weights are baked in.
  vision-image:
    runs-on: ubuntu-latest
    concurrency:
      group: reelvault-ghcr-mutation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-vision
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: vision
          platforms: linux/amd64,linux/arm64
          build-args: REELVAULT_FACES_EXTRA=1
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vision
          cache-to: type=gha,mode=max,scope=vision

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Check version matches tag
        run: |
          version=$(grep -oP '__version__ = "\K[^"]+' backend/reelvault/__init__.py)
          # vX.Y.Z must match the code; prereleases may add a suffix (vX.Y.Z-rc.1)
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version"-*) ;;
            *) echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1 ;;
          esac
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # GHCR image names must be lowercase
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - run: cd frontend && npm ci
      - run: make package VERSION=$VERSION
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/reelvault-${{ env.VERSION }}.tar.gz
            dist/reelvault-${{ env.VERSION }}.tar.gz.sha256
          body: |
            ## 安装

            **Docker**
            ```bash
            docker run -d --name reelvault -p 8080:8080 -v $PWD/data:/data ${{ env.IMAGE }}:${{ env.VERSION }}
            ```

            **Ubuntu**
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/reelvault-${{ env.VERSION }}.tar.gz
            tar xzf reelvault-${{ env.VERSION }}.tar.gz && cd reelvault-${{ env.VERSION }}
            sudo ./deploy/install.sh
            ```

            **可选视觉／人脸模型服务**：`${{ env.IMAGE }}-vision:${{ env.VERSION }}`，部署与接入见 `vision/README.md`。
