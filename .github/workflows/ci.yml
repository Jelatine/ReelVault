name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra link-import
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy reelvault
      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  whisper:
    name: Whisper (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install transcription and speech fixture tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak
          cd backend
          uv sync --frozen --extra transcription
      - name: Verify real offline Whisper inference and timed subtitle search
        env:
          REELVAULT_TEST_WHISPER_CACHE: ${{ runner.temp }}/whisper-models
          REELVAULT_TEST_SPEECH: ${{ runner.temp }}/whisper-speech.mp4
        run: |
          espeak -s 140 -w "$RUNNER_TEMP/speech.wav" "The secret phrase is purple elephant. We remember every word."
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=blue:s=320x180:r=15 -i "$RUNNER_TEMP/speech.wav" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$REELVAULT_TEST_SPEECH"
          cd backend
          uv run --frozen --extra transcription python -m reelvault.media.transcription_worker --prepare --model tiny --cache "$REELVAULT_TEST_WHISPER_CACHE"
          uv run --frozen --extra transcription pytest -q tests/test_content_search.py::test_real_whisper_transcribes_and_indexes_speech

  vision:
    name: CLIP (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: vision/uv.lock
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clip-models
          key: clip-b32-327ab672-multilingual-58edf8ca-safetensors-v1
      - run: uv sync --frozen
      - name: Lint and verify real offline multilingual CLIP
        env:
          REELVAULT_TEST_CLIP_CACHE: ${{ runner.temp }}/clip-models
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen reelvault-vision --cache "$REELVAULT_TEST_CLIP_CACHE" --prepare
          uv run --frozen pytest -q
      - name: Verify independent container starts offline
        run: |
          docker build -t reelvault-vision:ci .
          docker run -d --name rv-vision --read-only --tmpfs /tmp:size=64m -p 127.0.0.1:8091:8091 -v "$RUNNER_TEMP/clip-models:/models:ro" -e REELVAULT_VISION_TOKEN=ci-vision-token-0123456789abcdef0123456789abcdef reelvault-vision:ci
          for i in $(seq 1 60); do
            if curl -fsS -H 'Authorization: Bearer ci-vision-token-0123456789abcdef0123456789abcdef' http://127.0.0.1:8091/health; then exit 0; fi
            sleep 2
          done
          docker logs rv-vision
          exit 1

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          cd backend
          uv sync --frozen --extra link-import
      - name: Build and test in Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e
      - name: Verify on-demand HEVC playback in Chromium
        working-directory: frontend
        env:
          REELVAULT_PLAYABLE_EAGER_MAX_MB: "0"
        run: npm run test:e2e -- playback-cache.spec.ts
      - name: Upload browser traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, systemd, whisper]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: reelvault:ci
          build-args: REELVAULT_LINK_IMPORT_EXTRA=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm --entrypoint deno reelvault:ci --version
          docker run --rm --entrypoint python reelvault:ci -c "import yt_dlp, yt_dlp_ejs"
          docker run -d --name rv -p 8080:8080 reelvault:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs rv
          exit 1

  systemd:
    name: systemd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [backend, frontend]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Build release package
        run: |
          cd frontend
          npm ci
          cd ..
          make package VERSION=ci
      - name: Verify real install and online upgrade under systemd
        run: sudo env GITHUB_ACTIONS=true python3 deploy/test-systemd.py
