services:
  reelvault:
    image: ghcr.io/jelatine/reelvault:latest
    build: .
    container_name: reelvault
    restart: unless-stopped
    ports:
      - "34123:34123"
    volumes:
      - ./data:/data
      # Optional: mount an existing video folder and scan it from Settings
      # - /path/to/videos:/import:ro
    environment:
      # Leave empty to create the admin account in the browser on first visit
      REELVAULT_ADMIN_USER: ${REELVAULT_ADMIN_USER:-}
      REELVAULT_ADMIN_PASSWORD: ${REELVAULT_ADMIN_PASSWORD:-}
      # Concurrent jobs; each ffmpeg already uses all cores, use 1 on small machines
      REELVAULT_WORKERS: ${REELVAULT_WORKERS:-2}
      # CPU niceness of ffmpeg and other job processes (0-19, 0 disables)
      REELVAULT_JOB_NICE: ${REELVAULT_JOB_NICE:-10}
      # Set to true when served over HTTPS (behind a reverse proxy)
      REELVAULT_SECURE_COOKIES: ${REELVAULT_SECURE_COOKIES:-false}
      # REELVAULT_IMPORT_DIR: /import

  # Optional HTTPS + HTTP/2 front: docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    container_name: reelvault-caddy
    restart: unless-stopped
    depends_on:
      - reelvault
    ports:
      - "${REELVAULT_HTTPS_PORT:-443}:443"
      - "${REELVAULT_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      # Address clients use: LAN IP, hostname or public domain
      REELVAULT_SITE: ${REELVAULT_SITE:-localhost}

volumes:
  caddy_data:
