services:
  reelvault:
    image: ghcr.io/jelatine/reelvault:latest
    build: .
    container_name: reelvault
    restart: unless-stopped
    ports:
      - "34123:34123"
    volumes:
      - ./data:/data
      # Optional: mount an existing video folder and scan it from Settings
      # - /path/to/videos:/import:ro
    environment:
      # Leave empty to create the admin account in the browser on first visit
      REELVAULT_ADMIN_USER: ${REELVAULT_ADMIN_USER:-}
      REELVAULT_ADMIN_PASSWORD: ${REELVAULT_ADMIN_PASSWORD:-}
      REELVAULT_WORKERS: ${REELVAULT_WORKERS:-2}
      # Set to true when served over HTTPS (behind a reverse proxy)
      REELVAULT_SECURE_COOKIES: ${REELVAULT_SECURE_COOKIES:-false}
      # REELVAULT_IMPORT_DIR: /import
